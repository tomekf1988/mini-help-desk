services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${MINI_HELP_DESK_DB_USER}:${MINI_HELP_DESK_DB_PASSWORD}@${MINI_HELP_DESK_DB_HOST}:${MINI_HELP_DESK_DB_PORT:-5432}/${MINI_HELP_DESK_DB_NAME}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    ports:
      - "${MINI_HELP_DESK_PORT_PREFIX}8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic

  frontend:
    build:
      context: ./frontend
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:${MINI_HELP_DESK_PORT_PREFIX}8000
      BACKEND_URL: http://backend:8000
    ports:
      - "${MINI_HELP_DESK_PORT_PREFIX}5173:5173"
    volumes:
      - ./frontend/src:/app/src
