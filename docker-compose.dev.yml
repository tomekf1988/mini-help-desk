services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${MINI_HELP_DESK_DB_NAME}
      POSTGRES_USER: ${MINI_HELP_DESK_DB_USER}
      POSTGRES_PASSWORD: ${MINI_HELP_DESK_DB_PASSWORD}
    ports:
      - "${MINI_HELP_DESK_PORT_PREFIX}5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINI_HELP_DESK_DB_USER} -d ${MINI_HELP_DESK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql://${MINI_HELP_DESK_DB_USER}:${MINI_HELP_DESK_DB_PASSWORD}@db:5432/${MINI_HELP_DESK_DB_NAME}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
